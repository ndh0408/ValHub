name: valvn
description: "ValVN - Ứng dụng đồng hành Valorant tiếng Việt"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Flutter 3.47 Material split: import package:material_ui, not flutter/material.
  material_ui: ^1.4.0
  cupertino_ui: ^1.1.1
  cupertino_icons: ^1.0.8

  # state / routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # network / auth
  dio: ^5.11.1
  flutter_inappwebview: 6.2.0-beta.3   # exact pin: stable 6.1.5 breaks on AGP 9
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2

  # storage / cache
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  cached_network_image: ^4.0.2
  flutter_cache_manager: ^3.4.5

  # media / charts
  video_player: ^2.14.0
  fl_chart: ^1.2.0

  # notifications / background
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  workmanager: ^0.10.10

  # misc
  intl: ^0.20.3
  collection: ^1.19.1
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  xml: ^7.1.0
  share_plus: ^13.3.0
  image_picker: ^1.2.3
  google_mlkit_translation: ^0.15.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2   # in-memory prefs in tests
  flutter_launcher_icons: ^0.14.4

# flutter_inappwebview 6.2.0-beta.3 depends on the 1.1.x platform packages via caret
# ranges that don't select prereleases; pin the whole family to the self-consistent beta line.
dependency_overrides:
  flutter_inappwebview_android: 1.2.0-beta.3
  flutter_inappwebview_ios: 1.2.0-beta.3
  flutter_inappwebview_macos: 1.2.0-beta.3
  flutter_inappwebview_web: 1.2.0-beta.3
  flutter_inappwebview_windows: 0.7.0-beta.3
  flutter_inappwebview_platform_interface: 1.4.0-beta.3

flutter:
  uses-material-design: true
  # gen-l10n (l10n.yaml): `flutter pub get` / `flutter run` regenerate
  # lib/l10n/gen from lib/l10n/arb. The output is committed (I18N.md 3.5).
  generate: true
  assets:
    - assets/config/
    - assets/data/
    - assets/l10n/countries/
    - assets/l10n/languages/
    - assets/l10n/UNICODE-LICENSE.txt
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf

# App icon (original ValVN artwork, see tool/generate_icon.py).
# Regenerate: `python3 tool/generate_icon.py && dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#0F1923"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0F1923"
