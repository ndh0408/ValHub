# ValVN community server: API + daily backup.
#
#   cp .env.example .env            # fill SESSION_SECRET / PEPPER / PUBLIC_BASE_URL, chmod 600 .env
#   docker compose build
#   docker compose up -d            # starts valvn-community and valvn-backup
#
# Reachable only from the host itself (127.0.0.1:8787); Cloudflare Tunnel forwards to it.
# On a host where cloudflared runs in another compose stack, join the shared `edge` network with
# docker-compose.override.example.yml (copy it to docker-compose.override.yml).

services:
  valvn-community:
    build: .
    image: valvn-community:latest
    container_name: valvn-community
    restart: unless-stopped
    stop_grace_period: 15s
    cpus: "1.0"
    init: true
    env_file: .env
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # This stack is reached through the Cloudflare Tunnel only (loopback publish + the private `edge` network), so
      # CF-Connecting-IP identifies the client. The server's own default is false (see README, CS-13).
      TRUST_PROXY: ${TRUST_PROXY:-true}
    ports:
      - "127.0.0.1:8787:8080"
    volumes:
      - valvn-community-data:/data
    # Hardening: read-only root, no capabilities, no privilege escalation, bounded memory / processes.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    # Same probe as the Dockerfile HEALTHCHECK, visible and tunable here. `restart: unless-stopped` restarts
    # a crashed process but Docker never restarts a container just because it is "unhealthy": watch
    # `docker compose ps` (or add willfarrell/autoheal) — see README "Restart policy and health".
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Daily consistent snapshot of the SQLite database + media archive, kept BACKUP_KEEP_DAYS (default 14) days.
  # Same image (needs better-sqlite3); runs ops/backup-loop.sh as an unprivileged user with a read-only root.
  # One-off backup:  docker compose run --rm -e BACKUP_ONCE=1 valvn-backup
  valvn-backup:
    image: valvn-community:latest
    container_name: valvn-backup
    restart: unless-stopped
    depends_on: [valvn-community]
    user: "1000:1000"
    entrypoint: ["sh", "/backup-loop.sh"]
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - valvn-community-data:/data
      # Create it first: mkdir -p ./backups && chown 1000:1000 ./backups && chmod 700 ./backups
      - ${BACKUP_DIR:-./backups}:/backup
      - ./ops/backup-loop.sh:/backup-loop.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid
    cpus: "0.5"
    init: true
    healthcheck:
      test: ["CMD", "node", "dist/backup.js", "health", "/backup"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 10m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  valvn-community-data:
    name: valvn-community-data
