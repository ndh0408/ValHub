include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated by `flutter gen-l10n` (committed, never hand-edited).
    - lib/l10n/gen/**
    # Isolated package with its own pubspec / analyzer pin (I18N.md 5.1).
    - tool/l10n_codemod/**
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls          # forces defensive JSON parsing
    - cancel_subscriptions
    - discarded_futures
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_build_context_synchronously
