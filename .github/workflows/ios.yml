name: iOS IPA

on:
  push:
    branches: [main, claude/jolly-hawking-23o2j8]
    tags: ['v*']
  # macOS minutes are expensive: pull requests run when iOS-relevant files or
  # dependencies change (Dart code is already analyzed/tested by android.yml).
  pull_request:
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# Read-only by default; only the tag-release job below may write.
permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'
  XCODE_VERSION: '26.6'

jobs:
  ipa:
    runs-on: macos-26            # arm64; macos-latest also points here
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.signed.outcome }}
      artifact: ValVN-ios-signed-${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.number }}
    env:
      # Signing needs all four secrets (see docs/BUILD.md §3); otherwise only
      # the unsigned IPA is built.
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' && secrets.IOS_CERT_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Version info
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          BASE="$(sed -n 's/^version:.*+\([0-9][0-9]*\).*$/\1/p' pubspec.yaml)"
          [[ "$BASE" =~ ^[0-9]+$ ]] || { echo "::error::Missing pubspec build number"; exit 1; }
          echo "number=$((BASE + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

      - run: flutter --version && xcodebuild -version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # ---------- Unsigned IPA (always) ----------
      - name: Build iOS app (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.number }}

      - name: Package unsigned IPA
        id: unsigned
        run: |
          set -euo pipefail
          mkdir -p dist build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry "../../dist/ValVN-${{ steps.ver.outputs.name }}-unsigned.ipa" Payload)  # -y keeps framework symlinks
          ls -lh dist

      # Uploaded before any signing step, so a signing failure never loses it.
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ValVN-ios-unsigned-${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.number }}
          path: dist/*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # ---------- Optional signed IPA (only runs if secrets are set) ----------
      # continue-on-error: an expired profile or a wrong certificate must not
      # take the unsigned IPA and the GitHub Release down with it.
      - name: Install signing certificate and provisioning profile
        id: install_signing
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/cert.p12"; PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          KC="$RUNNER_TEMP/app-signing.keychain-db"; KCPW="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          echo -n "$P12_BASE64" | base64 --decode -o "$CERT"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC"
          security list-keychain -d user -s "$KC"
          PLIST="$(security cms -D -i "$PROFILE")"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$PLIST")
          # Xcode 16+ reads profiles from UserData; keep the legacy path too.
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$PROFILE" "$d/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Build signed IPA
        id: signed
        if: env.HAS_SIGNING == 'true' && steps.install_signing.outcome == 'success'
        continue-on-error: true
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: vn.valvn.app
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'release-testing' }}   # release-testing (ad-hoc) | debugging | app-store-connect
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EOF
          # Development profile + certificate for "debugging", distribution otherwise.
          if [[ "$EXPORT_METHOD" == "debugging" || "$EXPORT_METHOD" == "development" ]]; then
            IDENTITY="Apple Development"
          else
            IDENTITY="Apple Distribution"
          fi
          # Signing is scoped to the Runner target: ios/Flutter/Release.xcconfig
          # is the base configuration of Runner's Release/Profile only. Global
          # xcodebuild settings (FLUTTER_XCODE_*) would also hit the SwiftPM
          # plugin resource-bundle targets, which reject a provisioning profile.
          cat >> ios/Flutter/Release.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          CODE_SIGN_IDENTITY = ${IDENTITY}
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = ${IDENTITY}
          EOF
          flutter build ipa --release \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.number }}
          cp build/ios/ipa/*.ipa "dist/ValVN-${{ steps.ver.outputs.name }}-signed.ipa"

      - name: Upload signed IPA
        if: steps.signed.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ValVN-ios-signed-${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.number }}
          path: dist/*-signed.ipa
          if-no-files-found: warn
          retention-days: 30

      - name: Signing failed warning
        if: env.HAS_SIGNING == 'true' && steps.signed.outcome != 'success'
        run: echo "::warning::Signed IPA failed (see the signing steps); only the unsigned IPA is published."

      - name: Refuse an unsigned release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signed.outcome != 'success'
        run: |
          echo "::error::A tag release requires a successfully signed IPA. Unsigned review artifacts remain available from this run."
          exit 1

      - name: Remove keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  # Unsigned IPAs remain review artifacts; tag releases require signing. The
  # only job with a write token publishes the IPA the build job produced.
  release:
    needs: ipa
    if: startsWith(github.ref, 'refs/tags/v') && needs.ipa.outputs.signed == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.ipa.outputs.artifact }}
          path: dist

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*-signed.ipa
          prerelease: ${{ contains(github.ref_name, '-') }}
