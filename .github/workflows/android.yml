name: Android APK

on:
  push:
    branches: [main, claude/jolly-hawking-23o2j8]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; only the tag-release job below may write.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact: ValVN-android-${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.number }}
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Android SDK components
        if: github.event_name != 'pull_request'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" \
                            "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Version info
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          BASE="$(sed -n 's/^version:.*+\([0-9][0-9]*\).*$/\1/p' pubspec.yaml)"
          [[ "$BASE" =~ ^[0-9]+$ ]] || { echo "::error::Missing pubspec build number"; exit 1; }
          echo "number=$((BASE + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter analyze
      - run: python3 -m unittest discover -s tool/qa -p test_flutter_coverage.py
      - run: flutter test --coverage
      - name: Summarize instrumented line coverage
        run: |
          python3 tool/qa/flutter_coverage.py
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage evidence
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flutter-line-coverage
          path: |
            coverage/lcov.info
            coverage/summary.json
            coverage/summary.md
          if-no-files-found: error
          retention-days: 30

      # android/app/build.gradle.kts reads android/key.properties when present
      # (storeFile is resolved relative to android/app/) and otherwise falls
      # back to debug signing, so this step is entirely optional.
      - name: Decode release keystore
        if: github.event_name != 'pull_request' && env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KS_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APKs (universal + per-ABI)
        if: github.event_name != 'pull_request'
        run: |
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ValVN-${{ steps.ver.outputs.name }}-universal.apk"
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.number }}
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/ValVN-${{ steps.ver.outputs.name }}-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          if [ "$HAS_KEYSTORE" != "true" ]; then echo "::warning::APK được ký bằng DEBUG key (chưa cấu hình secret ANDROID_KEYSTORE_BASE64)"; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name != 'pull_request'
        with:
          name: ValVN-android-${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # Every GitHub-hosted runner generates a NEW random debug keystore, so
      # debug-signed APKs from two runs can never update each other (the tester
      # would have to uninstall and lose every signed-in account). A tag
      # release therefore requires the real keystore; the run's artifact above
      # is still uploaded for testing.
      - name: Refuse a debug-signed release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Không phát hành GitHub Release khi APK ký bằng debug key ngẫu nhiên của CI (bản sau không cập nhật đè được bản trước). Cấu hình secret ANDROID_KEYSTORE_BASE64 (docs/BUILD.md §4)."
          exit 1

      - name: Clean secrets
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

  # Publishes the exact artifact the build job tested and signed; the only job
  # with a write token, and it never sees the signing secrets. The build job
  # already fails a tag run without the real keystore.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
